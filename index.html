<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mesa de Cierre — Sistema de Liquidaciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-app:#EEF0EC; --panel:#FFFFFF; --ink:#1E2A28; --ink-soft:#5C6B67;
    --navy:#1F3B4D; --navy-soft:#28495F; --navy-dark:#152A37;
    --accent:#C77D2E; --accent-dark:#A6631E; --accent-tint:#F4E3D0;
    --success:#3F7859; --success-tint:#E1EEE6; --alert:#B23A34; --alert-tint:#F8E3E2;
    --line:#D8DDD7;
    --f-display:'Oswald',sans-serif; --f-body:'Inter',sans-serif; --f-mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg-app);color:var(--ink);font-family:var(--f-body);font-size:14px;}
  h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;letter-spacing:.02em;text-transform:uppercase;}
  button{font-family:var(--f-body);cursor:pointer;border:none;border-radius:6px;}
  input,select,textarea{font-family:var(--f-body);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13px;background:#fff;color:var(--ink);}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}
  table{border-collapse:collapse;width:100%;}
  th,td{text-align:left;padding:7px 9px;font-size:12.5px;border-bottom:1px solid var(--line);}
  th{font-family:var(--f-display);font-weight:500;letter-spacing:.04em;text-transform:uppercase;font-size:11px;color:var(--ink-soft);background:#F5F6F3;position:sticky;top:0;}
  .mono{font-family:var(--f-mono);}
  .app{display:none;min-height:100vh;grid-template-columns:220px 1fr;grid-template-rows:64px 1fr;grid-template-areas:"topbar topbar" "sidebar main";}
  .app.active{display:grid;}
  .topbar{grid-area:topbar;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;}
  .sidebar{grid-area:sidebar;background:var(--navy-dark);color:#fff;padding:16px 0;overflow-y:auto;}
  .main{grid-area:main;padding:20px 24px;overflow-y:auto;}
  .side-item{padding:10px 20px;font-size:13px;color:#C9D3D6;cursor:pointer;border-left:3px solid transparent;display:flex;justify-content:space-between;align-items:center;}
  .side-item:hover{background:rgba(255,255,255,.05);color:#fff;}
  .side-item.active{background:var(--navy-soft);color:#fff;border-left-color:var(--accent);}
  .side-label{padding:14px 20px 6px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#7C8C90;font-family:var(--f-display);}
  .badge{font-size:10px;background:rgba(255,255,255,.12);padding:1px 6px;border-radius:10px;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px;}
  .btn{padding:9px 16px;font-size:13px;font-weight:500;border-radius:6px;}
  .btn-accent{background:var(--accent);color:#fff;}
  .btn-accent:hover{background:var(--accent-dark);}
  .btn-outline{background:#fff;border:1px solid var(--line);color:var(--ink);}
  .btn-outline:hover{background:#F5F6F3;}
  .btn-ghost{background:transparent;color:var(--ink-soft);}
  .btn-sm{padding:5px 10px;font-size:12px;}
  .pill{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11px;font-weight:500;}
  .pill-success{background:var(--success-tint);color:var(--success);}
  .pill-accent{background:var(--accent-tint);color:var(--accent-dark);}
  .modal-bg{display:none;position:fixed;inset:0;background:rgba(20,28,26,.5);z-index:50;align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 20px;}
  .modal-bg.active{display:flex;}
  .modal{background:#fff;border-radius:10px;max-width:640px;width:100%;padding:24px;}
  .field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;}
  .field label{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy);}
  .login-card{background:#fff;border-radius:12px;padding:36px;width:380px;}
  .stamp-btn{position:relative;transition:transform .12s;}
  .stamp-btn.stamping{transform:scale(.94);}
  .cell-corregida{background:#FFF3B0!important;position:relative;}
  .corte-group-title{font-family:var(--f-display);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--navy);background:#F5F6F3;padding:8px 10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
  @media print{
    body *{visibility:hidden;}
    #acuse-print, #acuse-print *{visibility:visible;}
    #acuse-print{position:absolute;top:0;left:0;width:100%;padding:20px;}
  }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <h1 style="font-size:20px;margin-bottom:4px;">Mesa de Cierre</h1>
    <p style="color:var(--ink-soft);font-size:13px;margin:0 0 22px;">Sistema de liquidaciones</p>
    <div class="field"><label>Número de teléfono</label><input id="login-telefono" type="tel" placeholder="10 dígitos" /></div>
    <div class="field"><label>Contraseña</label><input id="login-password" type="password" placeholder="••••••••" /></div>
    <button class="btn btn-accent" style="width:100%;margin-top:8px;" onclick="doLogin()">Entrar</button>
    <p id="login-error" style="color:var(--alert);font-size:12px;margin-top:10px;display:none;"></p>
    <p style="color:var(--ink-soft);font-size:11.5px;margin-top:16px;">¿No tienes cuenta? Pide al administrador que te registre en Firebase Authentication y en la sección de Usuarios del sistema, usando tu número de teléfono.</p>
  </div>
</div>

<div class="app" id="app">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:14px;">
      <h1 style="font-size:15px;color:#fff;">Mesa de Cierre</h1>
      <span class="pill" style="background:rgba(255,255,255,.12);color:#fff;" id="user-pill">—</span>
    </div>
    <div style="display:flex;align-items:center;gap:12px;">
      <span id="corte-label" class="mono" style="font-size:12px;color:#C9D3D6;"></span>
      <button class="btn btn-outline" onclick="exportExcel()">Descargar Excel</button>
      <button class="btn btn-outline" id="btn-nuevo-registro" onclick="openNuevoRegistro()">+ Nuevo registro</button>
      <button class="btn btn-accent stamp-btn" id="btn-corte" onclick="handleGenerarCorte()">Generar corte</button>
      <button class="btn btn-ghost" style="color:#C9D3D6;" onclick="doLogout()">Salir</button>
    </div>
  </div>
  <div class="sidebar" id="sidebar"></div>
  <div class="main" id="main"></div>
</div>

<div class="modal-bg" id="modal-registro">
  <div class="modal">
    <h2 style="font-size:15px;margin-bottom:16px;" id="modal-registro-title">Nuevo registro</h2>
    <div class="field"><label>Flota</label><select id="f-flotaId" onchange="updateSubflotaVisibility()"></select></div>
    <div class="field" id="field-subflota" style="display:none;"><label>Subflota / grupo local</label><input id="f-subflota" placeholder="Ej. Local Norte, Local Centro..."></div>
    <div class="grid3">
      <div class="field"><label># Operador</label><input id="f-numOp"></div>
      <div class="field"><label># Unidad</label><input id="f-numU"></div>
      <div class="field"><label># Liquidación</label><input id="f-numLiquidacion"></div>
    </div>
    <div class="grid3">
      <div class="field"><label>L — Total liquidaciones</label><input id="f-l" type="number"></div>
      <div class="field"><label>V — Vales recibidos</label><input id="f-v" type="number"></div>
      <div class="field"><label>C — Casetas recibidas</label><input id="f-c" type="number"></div>
    </div>
    <div class="grid2">
      <div class="field"><label>Vale de cierre</label><input id="f-valeCierre"></div>
      <div class="field"><label>C/INF</label><input id="f-cInf"></div>
    </div>
    <div class="field"><label>Otros</label><input id="f-otros" placeholder="Ej. 1 FITO, 1 NOTA"></div>
    <div class="grid2">
      <div class="field"><label>Fecha y hora — Vale de cierre</label><input id="f-fhValeCierre" type="datetime-local"></div>
      <div class="field"><label>Fecha y hora — Ticket</label><input id="f-fhTicket" type="datetime-local"></div>
    </div>
    <div class="grid2">
      <div class="field"><label>Fecha y hora — Entrega Op a MC</label><input id="f-fhEntrega" type="datetime-local"></div>
      <div class="field"><label>Fecha y hora — Contabilizar vale cierre</label><input id="f-fhContabilizar" type="datetime-local"></div>
    </div>
    <div class="field"><label>Comentario</label><textarea id="f-comentario" rows="2"></textarea></div>
    <div class="field"><label>Observación (Área de Liquidaciones)</label><textarea id="f-observacionLiq" rows="2" placeholder="Notas u observaciones sobre este registro..."></textarea></div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:8px;">
      <button class="btn btn-outline" onclick="closeModal('modal-registro')">Cancelar</button>
      <button class="btn btn-accent" onclick="saveRegistro()">Guardar registro</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="modal-acuse">
  <div class="modal" style="max-width:820px;">
    <div id="acuse-print"></div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px;">
      <button class="btn btn-outline" onclick="closeModal('modal-acuse')">Cerrar</button>
      <button class="btn btn-accent" onclick="window.print()">Imprimir acuse</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<!-- ============================================================
     CONFIGURACIÓN DE FIREBASE
     Reemplaza estos valores por los de TU proyecto de Firebase:
     Firebase Console > Configuración del proyecto > Tus apps > SDK setup
     ============================================================ -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, collection, doc, getDoc, setDoc, addDoc, updateDoc, onSnapshot, query
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "TU_API_KEY",
    authDomain: "TU_PROYECTO.firebaseapp.com",
    projectId: "TU_PROYECTO",
    storageBucket: "TU_PROYECTO.appspot.com",
    messagingSenderId: "TU_SENDER_ID",
    appId: "TU_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const dbFs = getFirestore(app);

  // Se expone en window para que el script principal (no-módulo) lo use.
  window.fb = {
    auth, dbFs,
    onAuthStateChanged, signInWithEmailAndPassword, signOut,
    collection, doc, getDoc, setDoc, addDoc, updateDoc, onSnapshot, query
  };
  window.fbReady = true;
  window.dispatchEvent(new Event('fb-ready'));
</script>
<script>
const HORARIOS = ['06:00','09:00','11:00','14:00','16:00','18:00'];
const DEFAULT_FLOTAS = ['FORÁNEO','ECOMMERCE','CIRCUITOS','DISTRIBUCIÓN','DHL','COSTCO','LIVERPOOL','CONTENEDORES','RYDER'];

let state = { flotas: [], liquidaciones: [], cortes: [], bitacora: [], usuarios: [] };
let currentUser = null;      // { uid, email, nombre, rol }
let currentFlota = null;
let currentView = 'captura';
let editingId = null;
let listenersActivos = [];

function whenFbReady(cb){
  if(window.fbReady) cb(); else window.addEventListener('fb-ready', cb, {once:true});
}

// ---------- Autenticación ----------
const DOMINIO_TECNICO = 'mesadecierre.local'; // dominio interno, no es un correo real

function telefonoAEmailTecnico(telefono){
  const digitos = telefono.replace(/\D/g,'');
  return digitos + '@' + DOMINIO_TECNICO;
}
function emailTecnicoATelefono(email){
  return email.split('@')[0];
}

async function doLogin(){
  const telefono = document.getElementById('login-telefono').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';
  if(!telefono || !password){ errEl.textContent = 'Escribe tu número de teléfono y contraseña.'; errEl.style.display='block'; return; }
  const emailTecnico = telefonoAEmailTecnico(telefono);
  try{
    await window.fb.signInWithEmailAndPassword(window.fb.auth, emailTecnico, password);
    // El resto del ingreso lo dispara onAuthStateChanged (ver abajo).
  }catch(e){
    errEl.textContent = 'Error de Firebase: ' + (e.code || e.message || 'desconocido');
    console.error('Detalle completo del error de login:', e);
    errEl.style.display = 'block';
  }
}
function doLogout(){
  window.fb.signOut(window.fb.auth);
}

async function iniciarSesionConPerfil(user){
  // Busca el perfil (nombre/rol) del usuario en Firestore, por su número de teléfono.
  const telefono = emailTecnicoATelefono(user.email);
  const ref = window.fb.doc(window.fb.dbFs, 'usuarios', telefono);
  const snap = await window.fb.getDoc(ref);
  if(!snap.exists()){
    document.getElementById('login-error').textContent = 'Tu cuenta existe pero no tiene un perfil asignado. Pide al administrador que te registre en el sistema.';
    document.getElementById('login-error').style.display = 'block';
    await window.fb.signOut(window.fb.auth);
    return;
  }
  const perfil = snap.data();
  if(perfil.activo === false){
    document.getElementById('login-error').textContent = 'Tu cuenta está desactivada. Contacta al administrador.';
    document.getElementById('login-error').style.display = 'block';
    await window.fb.signOut(window.fb.auth);
    return;
  }
  currentUser = { uid:user.uid, telefono, nombre: perfil.nombre, rol: perfil.rol };
  iniciarSuscripciones();
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').classList.add('active');
  const rolLabel = perfil.rol==='admin' ? 'Administrador' : (perfil.rol==='liquidaciones' ? 'Área de Liquidaciones' : 'Analista');
  document.getElementById('user-pill').textContent = perfil.nombre + ' · ' + rolLabel;
  document.getElementById('btn-nuevo-registro').style.display = perfil.rol==='liquidaciones' ? 'none' : 'inline-block';
  document.getElementById('btn-corte').style.display = perfil.rol==='liquidaciones' ? 'none' : 'inline-block';
  renderSidebar();
  renderCorteLabel();
  renderMain();
}

function cerrarSesionUI(){
  currentUser = null;
  listenersActivos.forEach(unsub=>unsub());
  listenersActivos = [];
  document.getElementById('app').classList.remove('active');
  document.getElementById('login-screen').style.display='flex';
}

// ---------- Firestore: tiempo real ----------
function iniciarSuscripciones(){
  const { collection, onSnapshot, dbFs } = window.fb;
  const colecciones = ['flotas','liquidaciones','cortes','bitacora','usuarios'];
  colecciones.forEach(nombre=>{
    const unsub = onSnapshot(collection(dbFs, nombre), snap=>{
      state[nombre] = snap.docs.map(d=>({ id:d.id, ...d.data() }));
      if(nombre==='flotas' && !currentFlota){
        currentFlota = state.flotas.find(f=>f.activa)?.id || null;
      }
      renderSidebar();
      renderMain();
      renderCorteLabel();
    }, err=>console.error('Firestore snapshot error en', nombre, err));
    listenersActivos.push(unsub);
  });
}

// ---------- Helpers de escritura ----------
async function fsAdd(coleccion, data){
  const { collection, addDoc, dbFs } = window.fb;
  const ref = await addDoc(collection(dbFs, coleccion), data);
  return ref.id;
}
async function fsSet(coleccion, id, data){
  const { doc, setDoc, dbFs } = window.fb;
  await setDoc(doc(dbFs, coleccion, id), data, { merge:false });
}
async function fsUpdate(coleccion, id, data){
  const { doc, updateDoc, dbFs } = window.fb;
  await updateDoc(doc(dbFs, coleccion, id), data);
}

async function cargarFlotasPorDefecto(){
  if(state.flotas.length){ alert('Ya existen flotas registradas.'); return; }
  for(const nombre of DEFAULT_FLOTAS){
    await fsAdd('flotas', { nombre, activa:true });
  }
}

function fmt(dt){
  if(!dt) return '—';
  const d = new Date(dt);
  return d.toLocaleString('es-MX',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
}
function fmtExcel(dt){
  if(!dt) return '';
  const d = new Date(dt);
  const pad = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function todayISO(){ return new Date().toISOString().slice(0,10); }

whenFbReady(()=>{
  window.fb.onAuthStateChanged(window.fb.auth, (user)=>{
    if(user) iniciarSesionConPerfil(user);
    else cerrarSesionUI();
  });
});

function renderSidebar(){
  const sb = document.getElementById('sidebar');
  let html = '<div class="side-label">Flotas</div>';
  state.flotas.filter(f=>f.activa).forEach(f=>{
    const count = state.liquidaciones.filter(l=>l.flotaId===f.id).length;
    html += `<div class="side-item ${currentView==='captura'&&currentFlota===f.id?'active':''}" onclick="selectFlota('${f.id}')">${f.nombre}<span class="badge">${count}</span></div>`;
  });
  if(currentUser.rol==='admin'){
    html += '<div class="side-label">Administración</div>';
    html += `<div class="side-item ${currentView==='consolidado'?'active':''}" onclick="selectView('consolidado')">Vista consolidada</div>`;
    html += `<div class="side-item ${currentView==='flotas'?'active':''}" onclick="selectView('flotas')">Gestión de flotas</div>`;
    html += `<div class="side-item ${currentView==='usuarios'?'active':''}" onclick="selectView('usuarios')">Gestión de usuarios</div>`;
    html += `<div class="side-item ${currentView==='bitacora'?'active':''}" onclick="selectView('bitacora')">Bitácora de cambios</div>`;
    html += `<div class="side-item ${currentView==='cortes'?'active':''}" onclick="selectView('cortes')">Historial de cortes</div>`;
  } else if(currentUser.rol==='analista'){
    html += '<div class="side-label">Cortes</div>';
    html += `<div class="side-item ${currentView==='cortes'?'active':''}" onclick="selectView('cortes')">Mis cortes generados</div>`;
  }
  sb.innerHTML = html;
}
function selectFlota(id){ currentFlota = id; currentView='captura'; renderSidebar(); renderMain(); }
function selectView(v){ currentView = v; renderSidebar(); renderMain(); }

function renderCorteLabel(){
  const info = proximoCorte();
  document.getElementById('corte-label').textContent = info.texto;
}
function cortesDeHoy(){
  return state.cortes.filter(c=>c.fecha===todayISO());
}
function proximoCorte(){
  const hoy = cortesDeHoy();
  const generados = new Set(hoy.map(c=>c.horario));
  const now = new Date();
  const nowMin = now.getHours()*60+now.getMinutes();
  let candidato = null;
  for(const h of HORARIOS){
    const [hh,mm] = h.split(':').map(Number);
    if(hh*60+mm <= nowMin) candidato = h;
  }
  if(!candidato) candidato = HORARIOS[0];
  if(!generados.has(candidato)) return { horario: candidato, texto: 'Pendiente: corte de las '+candidato };
  const siguiente = HORARIOS.find(h=>!generados.has(h));
  if(siguiente) return { horario: siguiente, texto: 'Siguiente corte: '+siguiente+' (adelantado)' };
  return { horario: 'EXTRA', texto: 'Todos los cortes de hoy generados' };
}

function renderMain(){
  const main = document.getElementById('main');
  if(currentView==='captura' && currentUser.rol==='liquidaciones') return renderLiquidacionesFlota(main);
  if(currentView==='captura') return renderCaptura(main);
  if(currentView==='consolidado') return renderConsolidado(main);
  if(currentView==='flotas') return renderGestionFlotas(main);
  if(currentView==='usuarios') return renderGestionUsuarios(main);
  if(currentView==='bitacora') return renderBitacora(main);
  if(currentView==='cortes') return renderCortes(main);
}

function cc(r, field){
  return (r.correcciones && r.correcciones.includes(field)) ? 'cell-corregida' : '';
}
function renderCaptura(main){
  const flota = state.flotas.find(f=>f.id===currentFlota);
  if(!flota){ main.innerHTML = '<p>Selecciona una flota.</p>'; return; }
  const regs = state.liquidaciones.filter(l=>l.flotaId===currentFlota).sort((a,b)=>b.creadoEn-a.creadoEn);
  main.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
      <h2 style="font-size:18px;">${flota.nombre}</h2>
      ${currentUser.rol!=='liquidaciones'?'<button class="btn btn-accent" onclick="openNuevoRegistro()">+ Nuevo registro</button>':''}
    </div>
    <div class="panel" style="padding:0;overflow-x:auto;">
      <table>
        <thead><tr>
          <th>#Op</th><th>#U</th><th>#Liquidación</th>${esFlotaConSubgrupos(currentFlota)?'<th>Subflota</th>':''}<th>L</th><th>V</th><th>C</th><th>Otros</th>
          <th>Vale cierre</th><th>Analista</th><th>C/INF</th><th>Fecha corte</th><th>Comentario</th><th>Observación</th><th></th>
        </tr></thead>
        <tbody>
        ${regs.length? regs.map(r=>`
          <tr>
            <td class="mono ${cc(r,'numOp')}">${r.numOp||''}</td><td class="mono ${cc(r,'numU')}">${r.numU||''}</td><td class="mono ${cc(r,'numLiquidacion')}">${r.numLiquidacion||''}</td>

function nowLocalDT(){
  const d = new Date();
  const off = d.getTimezoneOffset();
  return new Date(d.getTime()-off*60000).toISOString().slice(0,16);
}
function fillFlotaSelect(selectedId){

function esFlotaConSubgrupos(flotaId){
  const f = state.flotas.find(x=>x.id===flotaId);

const CAMPOS_DATOS = ['numOp','numU','numLiquidacion','l','v','c','valeCierre','cInf','otros','fhValeCierre','fhTicket','fhEntrega','fhContabilizar','comentario','subflota'];

async function saveRegistro(){
  const vals = {};
  [...CAMPOS_DATOS,'observacionLiq'].forEach(k=>{
    vals[k] = document.getElementById('f-'+k).value;
  });
  const flotaSeleccionada = document.getElementById('f-flotaId').value;
  if(!flotaSeleccionada){ alert('Selecciona la flota a la que corresponde este registro.'); return; }
  if(!vals.numLiquidacion){ alert('El folio de # Liquidación es obligatorio.'); return; }
  const now = Date.now();
  const esCorreccionLiq = currentUser.rol === 'liquidaciones';

  if(editingId){
    const r = state.liquidaciones.find(l=>l.id===editingId);
    const correcciones = [...(r.correcciones||[])];
    const cambios = {};
    const bitacoraNueva = [];

    if(r.flotaId !== flotaSeleccionada){
      const nombreAntes = state.flotas.find(f=>f.id===r.flotaId)?.nombre||'—';
      const nombreDespues = state.flotas.find(f=>f.id===flotaSeleccionada)?.nombre||'—';
      bitacoraNueva.push({idLiquidacion:r.id, usuario:currentUser.nombre, accion:'edición', campo:'flota', anterior:nombreAntes, nuevo:nombreDespues, fechaHora:now});
      cambios.flotaId = flotaSeleccionada;
    }
    Object.keys(vals).forEach(k=>{
      const oldV = r[k]==null?'':String(r[k]);
      const newV = vals[k];
      if(oldV !== newV){
        bitacoraNueva.push({idLiquidacion:r.id, usuario:currentUser.nombre, accion:'edición', campo:k, anterior:oldV, nuevo:newV, fechaHora:now});
        if(esCorreccionLiq && CAMPOS_DATOS.includes(k) && !correcciones.includes(k)) correcciones.push(k);
      }
      cambios[k] = k==='l'||k==='v'||k==='c' ? Number(newV||0) : newV;
    });
    cambios.correcciones = correcciones;
    cambios.modificadoPor = currentUser.nombre;
    cambios.modificadoEn = now;
    await fsUpdate('liquidaciones', r.id, cambios);
    for(const entrada of bitacoraNueva) await fsAdd('bitacora', entrada);
  } else {
    const flotaRegs = state.liquidaciones.filter(l=>l.flotaId===flotaSeleccionada);
    const reg = {
      flotaId: flotaSeleccionada,
      numOp:vals.numOp, numU:vals.numU, numLiquidacion:vals.numLiquidacion,
      l:Number(vals.l||0), v:Number(vals.v||0), c:Number(vals.c||0),
      otros:vals.otros, valeCierre:vals.valeCierre, cInf:vals.cInf,
      fhValeCierre:vals.fhValeCierre, fhTicket:vals.fhTicket, fhEntrega:vals.fhEntrega, fhContabilizar:vals.fhContabilizar,
      comentario:vals.comentario, subflota:vals.subflota, observacionLiq:vals.observacionLiq, correcciones:[],
      analistaMC: currentUser.nombre, fechaCorte: todayISO(), numSecuencia: flotaRegs.length+1,
      creadoPor: currentUser.nombre, creadoEn: now, modificadoPor:null, modificadoEn:null
    };
    const nuevoId = await fsAdd('liquidaciones', reg);
    await fsAdd('bitacora', {idLiquidacion:nuevoId, usuario:currentUser.nombre, accion:'creación', campo:'—', anterior:'—', nuevo:'Folio '+reg.numLiquidacion, fechaHora:now});
  }
  closeModal('modal-registro');
}

async function handleGenerarCorte(){
  const info = proximoCorte();

  setTimeout(()=>btn.classList.remove('stamping'),150);

  const hoy = cortesDeHoy().sort((a,b)=>a.generadoEn-b.generadoEn);
  const desde = hoy.length ? hoy[hoy.length-1].generadoEn : new Date().setHours(0,0,0,0);
  const ahora = Date.now();
  const incluidos = state.liquidaciones.filter(l=>l.creadoEn>desde && l.creadoEn<=ahora).map(l=>l.id);

  if(incluidos.length===0){
    if(!confirm('No hay registros nuevos desde el último corte. ¿Generar de todas formas?')) return;
  }
  const corte = { horario: info.horario, fecha: todayISO(), generadoPor: currentUser.nombre, generadoEn: ahora, registros: incluidos };
  const nuevoId = await fsAdd('cortes', corte);
  renderCorteLabel();
  if(currentView==='cortes') renderMain();
  verAcuse({ id: nuevoId, ...corte });
}

  document.getElementById('acuse-print').innerHTML = `

      <tbody>${rows || `<tr><td colspan="6" style="text-align:center;color:var(--ink-soft);padding:20px;">Sin registros en este corte.</td></tr>`}</tbody>
    </table>
    <p class="mono" style="font-size:11px;color:var(--ink-soft);margin-top:14px;">Total de registros: ${regs.length}</p>`;
  openModal('modal-acuse');
}

function openModal(id){ document.getElementById(id).classList.add('active'); }
function closeModal(id){ document.getElementById(id).classList.remove('active'); }

function plantillaVacia(conSub){
  const base = { '# Op':'', '# U':'', '# Liquidación':'' };
  if(conSub) base['Subflota'] = '';
  return Object.assign(base, {
    'L':'', 'V':'', 'C':'', 'Otros':'', 'Vale de Cierre':'', 'Analista MC':'', 'C/INF':'',
    'Fecha y Hora Vale Cierre':'', 'Fecha y Hora Ticket':'', 'Fecha y Hora Entrega Op a MC':'',
    'Fecha y Hora Contabilizar Vale Cierre':'', 'Fecha Corte':'', 'Num':'', 'Comentario':''
  });
}
async function exportExcel(){
  if(typeof XLSX === 'undefined'){ alert('No se pudo cargar el módulo de Excel. Revisa tu conexión e intenta de nuevo.'); return; }
  const wb = XLSX.utils.book_new();
  state.flotas.forEach(f=>{
    const regs = state.liquidaciones.filter(l=>l.flotaId===f.id);
    const conSub = esFlotaConSubgrupos(f.id);
    const rows = regs.map(r=>{
      const base = {
        '# Op': r.numOp, '# U': r.numU, '# Liquidación': r.numLiquidacion,
      };
      if(conSub) base['Subflota'] = r.subflota||'';
      Object.assign(base, {
        'L': r.l, 'V': r.v, 'C': r.c, 'Otros': r.otros,
        'Vale de Cierre': r.valeCierre, 'Analista MC': r.analistaMC, 'C/INF': r.cInf,
        'Fecha y Hora Vale Cierre': fmtExcel(r.fhValeCierre),
        'Fecha y Hora Ticket': fmtExcel(r.fhTicket),
        'Fecha y Hora Entrega Op a MC': fmtExcel(r.fhEntrega),
        'Fecha y Hora Contabilizar Vale Cierre': fmtExcel(r.fhContabilizar),
        'Fecha Corte': r.fechaCorte, 'Num': r.numSecuencia, 'Comentario': r.comentario
      });
      return base;
    });
    const ws = XLSX.utils.json_to_sheet(rows.length?rows:[plantillaVacia(conSub)]);
    XLSX.utils.book_append_sheet(wb, ws, f.nombre.substring(0,31));
  });
  const allRows = state.liquidaciones.map(r=>{
    const f = state.flotas.find(fl=>fl.id===r.flotaId);
    return {
      'Flota': f?f.nombre:'', 'Subflota': r.subflota||'', '# Op': r.numOp, '# U': r.numU, '# Liquidación': r.numLiquidacion,
      'L': r.l, 'V': r.v, 'C': r.c, 'Otros': r.otros, 'Vale de Cierre': r.valeCierre, 'Analista MC': r.analistaMC, 'C/INF': r.cInf,
      'Fecha y Hora Vale Cierre': fmtExcel(r.fhValeCierre), 'Fecha y Hora Ticket': fmtExcel(r.fhTicket),
      'Fecha y Hora Entrega Op a MC': fmtExcel(r.fhEntrega), 'Fecha y Hora Contabilizar Vale Cierre': fmtExcel(r.fhContabilizar),
      'Fecha Corte': r.fechaCorte, 'Num': r.numSecuencia, 'Comentario': r.comentario
    };
  });
  const wsBase = XLSX.utils.json_to_sheet(allRows.length?allRows:[Object.assign({'Flota':''}, plantillaVacia(true))]);
  XLSX.utils.book_append_sheet(wb, wsBase, 'BASE GRAL');
  XLSX.writeFile(wb, `Liquidaciones_${todayISO()}.xlsx`);
}

setInterval(()=>{ if(currentUser) renderCorteLabel(); }, 30000);
